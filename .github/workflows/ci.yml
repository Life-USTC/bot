name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-firacode fonts-noto-cjk fonts-noto-cjk-extra

      - name: Validate OpenAPI provenance
        id: openapi
        run: |
          make check-openapi-provenance
          echo "server-sha=$(make --no-print-directory print-openapi-commit)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned server OpenAPI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Life-USTC/server
          ref: ${{ steps.openapi.outputs.server-sha }}
          path: .server

      - name: Verify pinned OpenAPI source
        run: |
          test "$(git -C .server rev-parse HEAD)" = "${{ steps.openapi.outputs.server-sha }}"
          make check-openapi-source OPENAPI_SOURCE=.server/public/openapi.generated.json

      - name: Build and regenerate OpenAPI client
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Validate Compose definition
        run: |
          touch .env
          docker compose config --quiet

      - name: Test deployment transaction
        run: bash scripts/deploy-mac.test.sh

      - name: Check OpenAPI generated client is up-to-date
        run: |
          make generate
          git diff --exit-code

  renderd:
    name: Renderd
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy
          cache-workspaces: renderd
          cache-targets: false
          rustflags: ""

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-firacode fonts-noto-cjk fonts-noto-cjk-extra

      - name: Check, test, and release-build renderd
        run: |
          cargo fmt --manifest-path renderd/Cargo.toml -- --check
          cargo clippy --locked --manifest-path renderd/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path renderd/Cargo.toml
          cargo build --locked --release --manifest-path renderd/Cargo.toml

      - name: Render all card fixtures through the Go client
        env:
          RENDERD_ADDR: 127.0.0.1:9123
          RENDERD_SCALE: "3"
        run: |
          renderd/target/release/renderd >"$RUNNER_TEMP/renderd.log" 2>&1 &
          renderd_pid=$!
          trap 'kill "$renderd_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/renderd.log"' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-delay 1 --retry-max-time 30 --max-time 2 http://127.0.0.1:9123/healthz
          git fetch --no-tags origin b62f863fda82f9ddc1002de2ea89555f49eede8a 967932782ccda31aefe6d8405e860dc5cb2e5426
          ./scripts/render-reference.sh "$RUNNER_TEMP/render-examples/reference"
          go run ./cmd/render-examples -endpoint http://127.0.0.1:9123/render \
            -out "$RUNNER_TEMP/render-examples"

      - name: Save reference and Typst card examples
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typst-render-examples
          path: ${{ runner.temp }}/render-examples
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
