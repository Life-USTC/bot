name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-firacode fonts-noto-cjk fonts-noto-cjk-extra

      - name: Validate OpenAPI provenance
        id: openapi
        run: |
          make check-openapi-provenance
          echo "server-sha=$(make --no-print-directory print-openapi-commit)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned server OpenAPI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Life-USTC/server
          ref: ${{ steps.openapi.outputs.server-sha }}
          path: .server

      - name: Verify pinned OpenAPI source
        run: |
          test "$(git -C .server rev-parse HEAD)" = "${{ steps.openapi.outputs.server-sha }}"
          make check-openapi-source OPENAPI_SOURCE=.server/public/openapi.generated.json

      - name: Build and regenerate OpenAPI client
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Validate Compose definition
        run: |
          touch .env
          docker compose config --quiet

      - name: Check OpenAPI generated client is up-to-date
        run: |
          make generate
          git diff --exit-code

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
